# Single-package app (required so pnpm does not error: "packages field missing")
packages:
  - "."

# Allow native postinstall builds in Docker / CI
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# pnpm >= 10 reads overrides from this file; keep in sync with
# package.json pnpm.overrides (CI still uses pnpm 9.15.9, which reads both).
# F301: exact postcss + sharp after `pnpm audit --prod` is 0 high.
# Do not jump Next majors. Transitive pins only (postcss 8.5.26, sharp 0.35.5).
overrides:
  next: 16.3.8
  nanoid: ^3.3.17
  postcss: 8.5.26
  sharp: 0.35.5
  js-yaml: ^4.3.2
  undici: ^7.29.1
  fast-uri: 3.1.8
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  "@modelcontextprotocol/sdk": 1.31.0
  qs: ^6.16.0
  postcss-selector-parser: ^7.1.6
  ip-address: ^10.7.1
  "brace-expansion@^5.0.0": ^5.0.12
  hono: ^4.13.7
  "@hono/node-server": ^2.1.1
  browserslist: 4.28.7
  prisma: "5.22.0"
  "@prisma/client": "5.22.0"
