# Single-package app (required so pnpm does not error: "packages field missing")
packages:
  - "."

# Allow native postinstall builds in Docker / CI
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# pnpm >= 10 reads overrides from this file; keep in sync with
# package.json pnpm.overrides (CI still uses pnpm 9.15.9, which reads both).
# F301: exact postcss + sharp after `pnpm audit --prod` is 0 high.
# Do not jump Next majors. Transitive pins only (postcss 8.5.26, sharp 0.35.3).
overrides:
  next: 16.2.12
  nanoid: ^3.3.17
  postcss: 8.5.26
  sharp: 0.35.3
  js-yaml: ^4.3.1
  undici: ^7.29.0
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  "brace-expansion@^5.0.0": ^5.0.9
  hono: ^4.12.34
  "@hono/node-server": ^2.0.5
  prisma: "5.22.0"
  "@prisma/client": "5.22.0"
