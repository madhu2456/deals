# CI/CD Pipeline for Discounts
#
# Required secrets (deploy job only):
#   DEPLOY_HOST     — server IP
#   DEPLOY_USER     — madhu
#   DEPLOY_SSH_KEY  — private key authorized for madhu
#
# Optional:
#   DEPLOY_PORT     — SSH port (default 22)

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Eleven Pre-Deploy Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Secret scan
        run: bash scripts/verify-no-secrets.sh --tree

      - name: "Install pnpm (packageManager: pnpm@9.15.9)"
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.9

      - name: Set up Node 22 (LTS; Next.js 16 requires >= 20.9)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client explicitly. postinstall normally covers this,
      # but a cached/partial install or --ignore-scripts would leave
      # @prisma/client without generated exports (TS2305 + TS7006 cascade in tsc).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Gate 1 - JSON-LD + price-parser regression fixtures
        run: pnpm test:jsonld

      # DB-free (pure libs only: lib/format, lib/site) and ~1s,
      # so it fits the gate's exclusion rationale for test:all.
      - name: Gate 2 - Format helpers regression
        run: pnpm test:format

      # DB-free (pure libs only: lib/ip, lib/deal-url, lib/rate-limit) and ~1s,
      # so it fits the gate's exclusion rationale for test:all.
      - name: Gate 3 - Rate-limit + IP trust + URL normalization regression
        run: pnpm test:rate-limit

      # DB-free: scripts/check-offer-validity.ts imports Prisma lazily inside
      # main(); the test imports only the pure checker functions with a mocked
      # fetch (no network) plus source-copy assertions for F-DEAL-001.
      - name: Gate 4 - Offer-validity checker unit tests + copy consistency
        run: pnpm test:offer-checker

      # Self-contained: copies the repo dev DB when present, else provisions a
      # fresh temp DB via `prisma migrate deploy` (never touches a live DB),
      # then proves seed re-runs cannot clobber existing rows (F-DEAL-010).
      - name: Gate 5 - Seed idempotency regression
        run: pnpm test:seed-idempotency

      # Self-contained (same temp-DB strategy as seed-idempotency): proves two
      # consecutive seeds leave sitemap lastmod derivation unchanged and that
      # app/sitemap.ts carries no deploy-time restamp (F-DEAL-002).
      - name: Gate 6 - Sitemap lastmod stability regression
        run: pnpm test:sitemap-stability

      # Self-contained temp DB (seeds the fresh DB when no dev.db is present —
      # prisma/*.db is gitignored, so a clean CI checkout exercises this path):
      # admin-created APPROVED deals carry approvedAt (getLatestDeals + JSON-LD
      # validFrom), PENDING stays null (F-DEAL-012).
      - name: Gate 7 - Admin approvedAt regression
        run: pnpm test:approved-at

      # Self-contained temp DB (same fresh-DB seeding): report endpoint units —
      # valid/invalid id, rate limit (5/hr/IP), honeypot, cross-origin → 403
      # origin guard, counter storage (F-DEAL-006).
      - name: Gate 8 - Broken-deal report endpoint unit tests
        run: pnpm test:report-endpoint

      # DB-free static guard: Turnstile key parity (both or neither) + widget
      # code path + .env.example documentation (F-DEAL-003). Reads key
      # presence only — never values.
      - name: Gate 9 - Turnstile config parity + widget code path
        run: pnpm test:turnstile-config

      # DB-free static guard: GTM-PT2ZHD3W stays out of app/lib/Dockerfile/
      # .env.example, and empty NEXT_PUBLIC_GTM_ID returns no script/noscript.
      - name: Gate 10 - GTM env-only / empty=off
        run: pnpm test:gtm-env

      - name: Gate 11 - Type safety
        run: npx tsc --noEmit

  deploy:
    name: Deploy to Production
    needs: test
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: discounts-production
      cancel-in-progress: false

    steps:
      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          missing=0
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is missing."
            missing=1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_USER is missing. Set to: madhu"
            missing=1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY is missing (private key for madhu)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "::error::DEPLOY_SSH_KEY must be a private key (BEGIN ... PRIVATE KEY)."
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_SSH_KEY" | grep -q "END.*PRIVATE KEY"; then
            echo "::error::DEPLOY_SSH_KEY missing END line (truncated paste)."
            exit 1
          fi
          echo "Secrets OK. host=${DEPLOY_HOST} user=${DEPLOY_USER} path=/opt/deals"

      - name: Deploy over SSH as madhu
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR=/opt/deals
            echo "User=$(whoami) APP_DIR=${APP_DIR}"

            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "ERROR: App not found at ${APP_DIR}."
              exit 1
            fi

            cd "${APP_DIR}"

            # Fix ownership if root previously touched the tree (permission denied on git pull)
            if command -v sudo >/dev/null && sudo -n true 2>/dev/null; then
              echo "Ensuring ${APP_DIR} is owned by $(whoami)..."
              sudo chown -R "$(whoami):$(whoami)" "${APP_DIR}" || true
            fi

            # Avoid git "dubious ownership" after chown between root/madhu
            git config --global --add safe.directory "${APP_DIR}" || true

            # 1) Sync to origin/main EXACTLY (discard any local server edits / root leftovers)
            echo "Syncing to origin/main (hard reset)..."
            git fetch origin
            git checkout main
            # Keep .env and runtime data; reset only tracked files
            git reset --hard origin/main
            git clean -fd -e .env -e data -e 'prisma/*.db' -e 'prisma/*.db-journal'
            chmod +x deploy.sh docker/entrypoint.sh scripts/*.sh 2>/dev/null || true

            # 2) Update using latest script (no root required)
            export APP_DIR=/opt/deals
            export BRANCH=main
            export DOMAIN=deals.madhudadi.in
            export DEPLOY_USER=madhu
            export APP_PORT=3002
            ./deploy.sh --update

            # Ensure nginx config from repo is installed (if passwordless sudo available)
            if command -v sudo >/dev/null && sudo -n true 2>/dev/null; then
              echo "Installing nginx config from repo via sudo..."
              sudo APP_DIR=/opt/deals DOMAIN=deals.madhudadi.in APP_PORT=3002 \
                bash /opt/deals/scripts/setup-nginx-deals.sh || true
            fi

            echo "Waiting for health on :3002..."
            for i in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:3002/" >/dev/null 2>&1; then
                echo "Healthy."
                exit 0
              fi
              sleep 3
            done
            echo "Health check timed out:"
            docker compose logs --tail=100 || true
            exit 1
