# Port map on the Netcup server:
#   madhudadi.in (portfolio) → host :3000
#   blog                     → 127.0.0.1:3001
#   deals (this app)         → 127.0.0.1:3002  ← HOST port
#   udemy-enroller           → :8000
#
# Inside the container Next still listens on 3000; only the HOST maps to 3002.
# Nginx deals.madhudadi.in → proxy_pass http://127.0.0.1:3002
#
# SQLite data: DATABASE_URL default file:/app/data/deals.db (volume deals_data).
# Backups: scripts/backup-sqlite.sh + scripts/restore-sqlite.sh (see docs/ops/backup-restore.md).
# Host cron: `./deploy.sh --install-backup-cron` installs idempotent daily
# entries for backup-sqlite.sh (03:15 UTC) + verify_backup_freshness.sh
# (03:45 UTC). It auto-detects this named-volume mount and installs the
# container (exec) variant:
#   15 3 * * * cd /opt/deals && docker compose exec -T deals \
#     sh -c 'DATABASE_URL=file:/app/data/deals.db BACKUP_DIR=/app/data/backups /app/scripts/backup-sqlite.sh' \
#     >>/var/log/deals-backup.log 2>&1
# Bind-mount deployments (DB on a host path) get the plain host entries.

services:
  deals:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://deals.madhudadi.in}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
    container_name: deals-app
    restart: unless-stopped
    ports:
      # Host 3002 → container 3000 (do not use host 3000 — madhudadi.in uses it)
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/deals.db}
      NODE_ENV: production
      # Port INSIDE the container (unchanged)
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      RUN_SEED: ${RUN_SEED:-false}
      APP_PORT: "3002"
    # F010: OS-level least privilege to match the app-level one (the image
    # already runs as the unprivileged `nextjs` user, uid 1001 — F008).
    security_opt:
      # Setuid/setgid binaries inside the image cannot escalate privileges for
      # the container process (this is the Docker equivalent of the kernel's
      # NO_NEW_PRIVS flag).
      - no-new-privileges:true
    cap_drop:
      # ALL, with no cap_add. The app only opens a listening socket on
      # 0.0.0.0:3000 INSIDE the container and reads/writes its own volume —
      # no raw sockets, no ptrace, no process accounting, no setuid. Notably
      # NET_BIND_SERVICE is deliberately NOT added: the container port is 3000
      # (>= 1024), and the privileged host port 3002 belongs to the Docker
      # daemon, not to the container's user namespace.
      - ALL
    # Read-only root filesystem. Every path the app or the entrypoint writes to
    # is a mount below, so a writable / adds nothing: an attacker landing in
    # this process cannot drop tools, writable payloads or cron entries into
    # the image layers.
    read_only: true
    tmpfs:
      # Next's ISR/fetch cache. Without a writable cache the 24h revalidation
      # of /sitemap.xml (and any ISR route) fails EROFS after a day and serves
      # stale XML forever. Sized so revalidation loops cannot exhaust RAM.
      - /app/.next/standalone/.next/cache:rw,noexec,nosuid,size=128m
      # entrypoint.sh scratch dirs (npm cache, XDG cache), HOME=/tmp, and the
      # temp files sqlite3/prisma/spawn need. noexec keeps anything a
      # compromised process stages here from being executed.
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      # /app/data is the ONLY persistent write target (see docker-compose.yml
      # header): the SQLite database, its WAL sidecars and encrypted backups.
      - deals_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  deals_data:
