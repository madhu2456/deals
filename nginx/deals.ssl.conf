# Deals HTTPS — used when Let's Encrypt certs exist for __DOMAIN__
# Installed by deploy.sh → /etc/nginx/sites-available/deals

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Cloudflare real-client-IP (mirrors blog_platform nginx conf.d/00-cloudflare-real-ip.conf).
    # Without this, $remote_addr = CF edge IP and every rate-limit bucket collapses.
    include conf.d/00-cloudflare-real-ip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # Hardcoded apex — never $host, or a Host-header could redirect anywhere (open redirect)
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Certbot-managed snippets (present after certbot --nginx)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare real-client-IP (mirrors blog_platform nginx conf.d/00-cloudflare-real-ip.conf).
    # Without this, $remote_addr = CF edge IP and every rate-limit bucket collapses.
    include conf.d/00-cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}

# www → apex redirect (hardcoded target — never $host, or www would loop)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Certbot-managed snippets (present after certbot --nginx)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare real-client-IP (mirrors blog_platform nginx conf.d/00-cloudflare-real-ip.conf).
    # Without this, $remote_addr = CF edge IP and every rate-limit bucket collapses.
    include conf.d/00-cloudflare-real-ip.conf;

    return 301 https://__DOMAIN__$request_uri;
}
